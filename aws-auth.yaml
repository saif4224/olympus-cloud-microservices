apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - groups:
      - system:bootstrappers
      - system:nodes
      rolearn: arn:aws:iam::201727487946:role/eksctl-olympus-cluster-nodegroup-s-NodeInstanceRole-gzhITBJOpMVc
      username: system:node:{{EC2PrivateDNSName}}
    - groups:
      - system:masters
      rolearn: arn:aws:iam::201727487946:role/service-role/codebuild-Olympus-Build-service-role
      username: codebuild-user
  mapUsers: |
    []