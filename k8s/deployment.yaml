apiVersion: apps/v1
kind: Deployment
metadata:
  name: olympus-api
spec:
  replicas: 2  # Run 2 copies for High Availability
  selector:
    matchLabels:
      app: olympus-api
  template:
    metadata:
      labels:
        app: olympus-api
    spec:
      containers:
      - name: olympus-container
        image: 201727487946.dkr.ecr.us-east-1.amazonaws.com/olympus-app:latest 
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"