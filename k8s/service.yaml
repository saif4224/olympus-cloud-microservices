apiVersion: v1
kind: Service
metadata:
  name: olympus-service
spec:
  # 'LoadBalancer' creates an AWS Classic Load Balancer automatically
  type: LoadBalancer
  selector:
    app: olympus-api
  ports:
    - protocol: TCP
      port: 80          # The Load Balancer listens on Port 80 (HTTP)
      targetPort: 8080  # Forwards traffic to Container Port 8080
